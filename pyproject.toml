[project]
name = "localcockpit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psutil>=7,<8", "httpx>=0.28,<1", "pydantic>=2.9,<3"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 100
[tool.mypy]
ignore_missing_imports = true
